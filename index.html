    <script>
      (function() {
        // Suppress benign preview iframe WebSocket / HMR disconnect warnings
        window.addEventListener('error', function(e) {
          if (e && e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('websocket') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        });
        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).indexOf('WebSocket') !== -1) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        });

        try {
          var t = localStorage.getItem('memmori_theme');
          var isDark = t === 'dark' || (!t && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
